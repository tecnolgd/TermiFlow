  name: TermiFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request_target:
    types: [ "opened", "synchronize" ]

jobs:
  # Assignment check runs first
  check-assignment:
  runs-on: ubuntu-latest
  permissions:
    pull-requests: write
    issues: write

  steps:
    - name: Check if PR is from owner
      if: github.actor == github.repository_owner
      run: echo "PR opened by repository owner. Skipping check."

    - name: Check Issue Assignment
      if: github.actor != github.repository_owner
      uses: actions/github-script@v7
      with:
        script: |
           const pr = context.payload.pull_request;
           const author = pr.user.login;
              
          const body = pr.body || "";
          const match = body.match(/#(\d+)/);
              
          if (!match) {
            console.log("No linked issue found.");
            await failPR(`Hello @${author}! Please link a referenced issue (e.g., 'Fixes #81') in your PR description.`);
            return;
          }

          const issueNumber = parseInt(match[1]);
          const { data: issue } = await github.rest.issues.get({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber});
              
          const isAssigned = issue.assignees.some(a => a.login === author);
              
          if (!isAssigned) {
            await failPR(`Hello @${author}, Thank you for your contribution. As per the repository's guidelines, please ensure an issue is discussed and you are assigned to it before opening a pull request. Closing this PR for now.`);
          } else {
            console.log(`Assignment verified for @${author} on issue #${issueNumber}.`);
          }

          async function failPR(msg) {
            console.log("Assignment check failed! PR closed.");
              
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: msg});

            await github.rest.pulls.update({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, state: 'closed'});
          }

  build:
    needs: check-assignment
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Linux-specific setup and build
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ make
    - name: Show Linux CPU count
      if: matrix.os == 'ubuntu-latest'
      run: echo "NPROC=$(nproc)"
    - name: Compile Application (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: make linux -j$(nproc)

    - name: Run Tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: make test -j$(nproc)

    # Windows-specific setup and build
    - name: Setup MinGW Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Show Windows processor count
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"

    # Windows compilation and testing
    - name: Compile Application (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        mkdir -p build
        mingw32-make windows -j"$NUMBER_OF_PROCESSORS" CXX_MINGW=g++

    - name: Run Tests (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        # Using the same pipe logic if the test binaries require an enter key/exit selection
        echo "0" | mingw32-make test -j"$NUMBER_OF_PROCESSORS" || true
